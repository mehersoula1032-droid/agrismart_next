name: agrismart_next
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  shared_preferences: ^2.5.6
  google_generative_ai: ^0.4.6
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.0
  intl: ^0.20.3
  image_picker: ^1.2.4
  google_mlkit_image_labeling: ^1.0.3
  google_mlkit_text_recognition: ^1.0.3
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  firebase_ai: ^2.3.0
  google_maps_flutter: ^2.19.0
  geolocator: 14.1.2
  flutter_map: 8.3.2
  latlong2: 0.10.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo.png"

  http: ^1.2.2